[book]
title = "box-shell"
description = "User-space chroot, bind mounts and binfmt_misc — a clean-room Rust rewrite of PRoot"
authors = ["boxshell organization"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/boxshell-org/box-shell"
edit-url-template = "https://github.com/boxshell-org/box-shell/edit/main/docs/{path}"

[output.html.search]
enable = true

[preprocessor]
